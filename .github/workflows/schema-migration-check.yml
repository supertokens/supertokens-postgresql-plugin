name: "DB schema / migration manifest check"

# Backstop for the migration-scripts/manifest.json convention: the manifest is
# the source of truth the core release workflow derives has-db-migration from,
# so a schema-changing PR that forgets the manifest entry would silently ship
# an unguarded SaaS rollout. This job verifies, mechanically:
#   1. Whether the PR changes the DB schema at all — by booting the core with
#      the base-branch plugin and with the PR-head plugin against fresh
#      databases and diffing the pg_dump'd schemas.
#   2. If it does: that the PR also ships a migration script + manifest entry
#      keyed by this branch's plugin X.Y.Z, AND that applying that script to
#      the base schema (followed by a boot of the new core, matching the real
#      SaaS upgrade order) reproduces the fresh-install schema exactly —
#      catching wrong/incomplete scripts, not just missing ones.
#   3. For patch releases (build.gradle Z > 0): that the change is index-only
#      (the schema diff adds/removes nothing but CREATE INDEX statements), that
#      the script consists solely of CREATE INDEX CONCURRENTLY IF NOT EXISTS /
#      DROP INDEX CONCURRENTLY IF EXISTS, and that booting the new core on the
#      UN-migrated base schema ALSO reproduces the fresh-install schema — i.e.
#      the core applies the index changes itself at startup, which is what
#      makes the change safe for an in-place patch rollout (no migration hook
#      there). Anything else must bump the minor version.
#   4. That the CHANGELOG.md section for this branch's version documents the
#      migration under `### Migration` and references the script.
#
# Escape hatch: label the PR `skip-schema-check` (e.g. PRs against old release
# branches where core master no longer builds against this plugin).

on:
  pull_request:

jobs:
  schema-migration-check:
    name: Schema change requires a matching migration script
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-schema-check')"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: supertokens
          POSTGRES_PASSWORD: root
          POSTGRES_USER: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21.0.7
          distribution: zulu

      - name: Prepare a base-branch copy of the plugin
        run: git worktree add /tmp/plugin-base ${{ github.event.pull_request.base.sha }}

      - name: Point devConfig at the CI postgres (both copies)
        run: |
          for f in ./devConfig.yaml /tmp/plugin-base/devConfig.yaml; do
            sed -i "s/# postgresql_host:/postgresql_host: localhost/" "$f"
            sed -i "s/# postgresql_user:/postgresql_user: root/" "$f"
            sed -i "s/# postgresql_password:/postgresql_password: root/" "$f"
          done

      - name: Cloning supertokens-root
        run: cd ../ && git clone https://github.com/supertokens/supertokens-root.git
      - name: Modifying modules.txt in supertokens-root
        run: |
          cd ../supertokens-root
          printf 'core,master\nplugin-interface,master\npostgresql-plugin,master\n' > modules.txt
          cat modules.txt
      - name: Running loadModules in supertokens-root
        run: cd ../supertokens-root && ./loadModules

      - name: Create base and head databases
        run: |
          docker run --rm --network host -e PGPASSWORD=root postgres:latest psql -h localhost -U root -d supertokens -c "CREATE DATABASE schema_base;"
          docker run --rm --network host -e PGPASSWORD=root postgres:latest psql -h localhost -U root -d supertokens -c "CREATE DATABASE schema_head;"

      - name: Build with the base-branch plugin
        run: |
          cd ../supertokens-root
          rm -rf ./supertokens-postgresql-plugin
          cp -r /tmp/plugin-base ./supertokens-postgresql-plugin
          ./utils/setupTestEnv --local

      - name: Boot core on base plugin and dump schema
        run: |
          cd ../supertokens-root
          cp ./temp/config.yaml .
          echo "postgresql_database_name: schema_base" >> config.yaml
          java -classpath "./core/*:./plugin-interface/*:./ee/*" io.supertokens.Main ./ DEV &
          CORE_PID=$!
          for i in $(seq 1 120); do curl -sf http://localhost:3567/hello > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3567/hello > /dev/null
          kill $CORE_PID && wait $CORE_PID || true
          docker run --rm --network host -e PGPASSWORD=root postgres:latest pg_dump -h localhost -U root --schema-only --no-owner --no-privileges schema_base > /tmp/base-schema.sql

      - name: Swap in the PR-head plugin
        run: |
          cd ../supertokens-root
          rm -rf ./supertokens-postgresql-plugin
          cp -r "$GITHUB_WORKSPACE" ./supertokens-postgresql-plugin
          (cd supertokens-postgresql-plugin && ./runBuild noJarFolderChange)
          rm -f ./plugin/*
          cp supertokens-postgresql-plugin/build/libs/* ./plugin/
          cp supertokens-postgresql-plugin/build/dependencies/* ./plugin/ 2>/dev/null || true

      - name: Boot core on head plugin and dump schema
        run: |
          cd ../supertokens-root
          cp ./temp/config.yaml .
          echo "postgresql_database_name: schema_head" >> config.yaml
          java -classpath "./core/*:./plugin-interface/*:./ee/*" io.supertokens.Main ./ DEV &
          CORE_PID=$!
          for i in $(seq 1 120); do curl -sf http://localhost:3567/hello > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3567/hello > /dev/null
          kill $CORE_PID && wait $CORE_PID || true
          docker run --rm --network host -e PGPASSWORD=root postgres:latest pg_dump -h localhost -U root --schema-only --no-owner --no-privileges schema_head > /tmp/head-schema.sql

      - name: Classify schema diff
        id: classify
        run: |
          set +e
          python3 .github/helpers/schema-migration-check.py diff /tmp/base-schema.sql /tmp/head-schema.sql
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "10" ] && [ "$code" != "20" ]; then
            exit "$code"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Warn on manifest change without schema change
        if: steps.classify.outputs.code == '0'
        run: |
          if ! git diff --quiet ${{ github.event.pull_request.base.sha }} HEAD -- migration-scripts/; then
            echo "::notice::migration-scripts/ changed but the schema did not - make sure that is intentional."
          fi

      - name: Require manifest entry and verify migration equivalence
        id: verify
        if: steps.classify.outputs.code != '0'
        run: |
          base_sha=${{ github.event.pull_request.base.sha }}
          if git diff --quiet "$base_sha" HEAD -- migration-scripts/manifest.json; then
            echo "::error::This PR changes the DB schema but does not touch migration-scripts/manifest.json. Add a migration script and manifest entry keyed by this branch's plugin X.Y.Z (see migration-scripts/README.md). Patch releases may only add/drop indexes (CREATE/DROP INDEX CONCURRENTLY in the script, also done by the core at startup); anything else needs a minor release."
            exit 1
          fi
          # New manifest entries must be keyed by THIS branch's plugin X.Y.Z
          # (from build.gradle) - the core pairing is only decided at release
          # time, so a PR cannot know (and must not guess) a core version.
          plugin_version=$(grep -E '^version\s*=' build.gradle | cut -d'"' -f2)
          echo "plugin-version=$plugin_version" >> "$GITHUB_OUTPUT"
          patch_z=$(echo "$plugin_version" | cut -d. -f3)
          is_patch=$([ "$patch_z" != "0" ] && echo true || echo false)
          echo "is-patch=$is_patch" >> "$GITHUB_OUTPUT"
          if [ "$is_patch" = "true" ] && [ "${{ steps.classify.outputs.code }}" != "10" ]; then
            echo "::error::Plugin $plugin_version is a PATCH release, but this PR's schema change is not index-only (see the diff above). Patch releases may only add/drop indexes; columns, tables, constraints and data transforms must ship in a minor release (bump build.gradle to X.$((10#$(echo "$plugin_version" | cut -d. -f2)+1)).0)."
            exit 1
          fi
          if git show "$base_sha:migration-scripts/manifest.json" > /tmp/base-manifest.json 2>/dev/null; then
            base_manifest=/tmp/base-manifest.json
          else
            base_manifest=NONE
          fi
          python3 .github/helpers/schema-migration-check.py validate-new-entries migration-scripts/manifest.json "$base_manifest" "$plugin_version"
          changed_files=$(git diff --name-only "$base_sha" HEAD -- 'migration-scripts/*.sql')
          scripts=$(python3 .github/helpers/schema-migration-check.py changed-scripts migration-scripts/manifest.json $changed_files)
          if [ -z "$scripts" ]; then
            echo "::error::manifest.json changed, but no manifest-referenced .sql script was added or modified in this PR. The manifest entry must point at a script shipped in this PR."
            exit 1
          fi
          echo "scripts=$(echo $scripts)" >> "$GITHUB_OUTPUT"
          if [ "$is_patch" = "true" ]; then
            # Patch scripts: CREATE/DROP INDEX CONCURRENTLY, nothing else.
            python3 .github/helpers/schema-migration-check.py patch-script-check $(for s in $scripts; do echo "migration-scripts/$s"; done)
          fi
          echo "Applying migration script(s) to the base schema, in manifest order:"
          echo "$scripts"
          for s in $scripts; do
            # psql autocommit runs each statement separately, which is what
            # custom scripts (CREATE INDEX CONCURRENTLY) require.
            docker run --rm --network host -e PGPASSWORD=root -v "$GITHUB_WORKSPACE:/work" -w /work postgres:latest psql -v ON_ERROR_STOP=1 -h localhost -U root -d schema_base -f "migration-scripts/$s"
          done
          # Boot the NEW core against the migrated base schema - the same
          # order as a real SaaS upgrade (migrate, then boot) - so boot-time
          # objects (e.g. activity_log month partitions) exist on both sides
          # of the final comparison, and the new core is proven to start on a
          # migrated database.
          cd ../supertokens-root
          cp ./temp/config.yaml .
          echo "postgresql_database_name: schema_base" >> config.yaml
          java -classpath "./core/*:./plugin-interface/*:./ee/*" io.supertokens.Main ./ DEV &
          CORE_PID=$!
          for i in $(seq 1 120); do curl -sf http://localhost:3567/hello > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3567/hello > /dev/null
          kill $CORE_PID && wait $CORE_PID || true
          docker run --rm --network host -e PGPASSWORD=root postgres:latest pg_dump -h localhost -U root --schema-only --no-owner --no-privileges schema_base > /tmp/base-migrated-schema.sql
          cd "$GITHUB_WORKSPACE"
          python3 .github/helpers/schema-migration-check.py compare /tmp/base-migrated-schema.sql /tmp/head-schema.sql

      # Patch-release migrations rely on the new core creating/dropping the
      # indexes on its own at boot (that is the only thing that runs against every SaaS
      # database on an in-place patch rollout). Prove it: restore the base
      # schema into a fresh database, boot the NEW core on it WITHOUT running
      # the script, and require the result to equal the fresh-install schema.
      # If this fails, the change is missing from the startup backfill list.
      - name: Verify the core applies the index changes at startup (patch releases)
        if: steps.classify.outputs.code != '0' && steps.verify.outputs.is-patch == 'true'
        run: |
          echo "Patch release ${{ steps.verify.outputs.plugin-version }}: proving the new core applies ${{ steps.verify.outputs.scripts }} itself at startup"
          docker run --rm --network host -e PGPASSWORD=root postgres:latest psql -h localhost -U root -d supertokens -c "CREATE DATABASE schema_startup;"
          docker run --rm --network host -e PGPASSWORD=root -v /tmp:/dumps postgres:latest psql -v ON_ERROR_STOP=1 -q -h localhost -U root -d schema_startup -f /dumps/base-schema.sql
          cd ../supertokens-root
          cp ./temp/config.yaml .
          echo "postgresql_database_name: schema_startup" >> config.yaml
          java -classpath "./core/*:./plugin-interface/*:./ee/*" io.supertokens.Main ./ DEV &
          CORE_PID=$!
          for i in $(seq 1 120); do curl -sf http://localhost:3567/hello > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3567/hello > /dev/null
          kill $CORE_PID && wait $CORE_PID || true
          docker run --rm --network host -e PGPASSWORD=root postgres:latest pg_dump -h localhost -U root --schema-only --no-owner --no-privileges schema_startup > /tmp/startup-schema.sql
          cd "$GITHUB_WORKSPACE"
          if ! python3 .github/helpers/schema-migration-check.py compare /tmp/startup-schema.sql /tmp/head-schema.sql; then
            echo "::error::Patch release, but booting the new core on the un-migrated base schema does not reproduce the fresh-install schema - the core does NOT apply these index changes at startup, so existing SaaS databases would never receive them on an in-place rollout. Add them to GeneralQueries.createTablesIfNotExists' backfill list (CREATE INDEX IF NOT EXISTS / DROP INDEX IF EXISTS)."
            exit 1
          fi

      # A release that ships a migration must say so in its release notes:
      # the CHANGELOG section for this branch's version needs a
      # `### Migration` subsection referencing the script. (The core release
      # workflow applies the same check to supertokens-core's CHANGELOG.)
      - name: Require the migration to be documented in CHANGELOG.md
        if: steps.classify.outputs.code != '0'
        run: |
          python3 .github/helpers/schema-migration-check.py check-changelog CHANGELOG.md "${{ steps.verify.outputs.plugin-version }}" ${{ steps.verify.outputs.scripts }}
